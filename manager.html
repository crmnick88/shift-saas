<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>פורטל מנהל — ShiftSaaS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">

  <div id="screen-loading" class="section active" style="text-align:center; padding:60px 20px;">
    <div style="font-size:50px;">⏳</div>
    <p style="color:#888; margin-top:12px;">טוען נתונים...</p>
  </div>

  <div id="screen-main" class="section">
    <!-- Header -->
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
      <div>
        <h1 id="mgr-branch-name" style="margin-bottom:2px; font-size:1.6em;">📅 פורטל ניהול</h1>
        <div id="mgr-branch-code" style="color:#888; font-size:13px;"></div>
      </div>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <button class="btn sm secondary" onclick="window.location.href='setup.html'">⚙️ הגדרות</button>
        <button class="btn sm danger" onclick="logout()">יציאה</button>
      </div>
    </div>

    <!-- Trial banner -->
    <div id="trial-banner" style="display:none; background:#fff3cd; border:2px solid #ffc107; border-radius:10px; padding:12px 16px; margin-bottom:16px; text-align:center;">
      ⏳ <strong>מצב ניסיון</strong> — <span id="trial-days-left"></span> ימים נותרו
      <button class="btn sm" style="margin-right:12px; background:#ffc107; color:#000;" onclick="alert('Stripe יתווסף בקרוב!')">שדרג עכשיו</button>
    </div>

    <!-- Tabs -->
    <div class="nav-tabs">
      <div class="nav-tab active" onclick="switchTab('tab-schedule')">📅 סידור</div>
      <div class="nav-tab" onclick="switchTab('tab-constraints')">⚠️ אילוצים</div>
      <div class="nav-tab" onclick="switchTab('tab-employees')">👥 עובדים</div>
      <div class="nav-tab" onclick="switchTab('tab-settings')">⚙️ הגדרות</div>
    </div>

    <!-- ===== SCHEDULE TAB ===== -->
    <div id="tab-schedule" class="tab-panel active">
      <div class="toolbar">
        <button class="btn sm secondary" onclick="changeWeek(-1)">← שבוע קודם</button>
        <span id="schedule-week-label" style="font-weight:bold; padding:8px 12px; background:#f0f3ff; border-radius:8px;"></span>
        <button class="btn sm secondary" onclick="changeWeek(1)">שבוע הבא →</button>
        <button class="btn sm" onclick="runAutoSchedule()">⚡ צור סידור אוטומטי</button>
        <button class="btn sm success" onclick="publishSchedule()">📢 פרסם לעובדים</button>
        <button class="btn sm secondary" onclick="exportToExcel()">📊 ייצוא לאקסל</button>
      </div>

      <div id="schedule-container">
        <p style="color:#aaa; text-align:center; padding:40px;">לחץ "צור סידור אוטומטי" או בנה ידנית</p>
      </div>
      <div id="schedule-msg" class="message" style="display:none"></div>
    </div>

    <!-- ===== CONSTRAINTS TAB ===== -->
    <div id="tab-constraints" class="tab-panel">
      <div class="toolbar">
        <button class="btn sm secondary" onclick="changeWeekConstraints(-1)">← שבוע קודם</button>
        <span id="constraints-week-label" style="font-weight:bold; padding:8px 12px; background:#f0f3ff; border-radius:8px;"></span>
        <button class="btn sm secondary" onclick="changeWeekConstraints(1)">שבוע הבא →</button>
        <button class="btn sm" onclick="loadConstraints()">🔄 רענן</button>
      </div>
      <div id="constraints-container">
        <p style="color:#aaa; text-align:center; padding:40px;">טוען אילוצים...</p>
      </div>
    </div>

    <!-- ===== EMPLOYEES TAB ===== -->
    <div id="tab-employees" class="tab-panel">
      <div class="toolbar">
        <button class="btn sm success" onclick="showAddEmpModal()">➕ הוסף עובד</button>
      </div>
      <div id="employees-container"></div>

      <!-- Add Employee inline form -->
      <div id="add-emp-form" class="card" style="display:none; margin-top:16px;">
        <h3>➕ עובד חדש</h3>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
          <div class="form-group">
            <label>שם תצוגה</label>
            <input type="text" id="ae-display" placeholder="ישראל ישראלי">
          </div>
          <div class="form-group">
            <label>שם משתמש</label>
            <input type="text" id="ae-user" placeholder="ISRAEL" oninput="this.value=this.value.toUpperCase()">
          </div>
          <div class="form-group">
            <label>סיסמה</label>
            <input type="text" id="ae-pass" placeholder="סיסמה">
          </div>
          <div class="form-group">
            <label>מחלקה</label>
            <select id="ae-dept"></select>
          </div>
        </div>
        <div class="btn-row">
          <button class="btn success" onclick="addEmpFromManager()">💾 שמור</button>
          <button class="btn secondary" onclick="document.getElementById('add-emp-form').style.display='none'">ביטול</button>
        </div>
        <div id="ae-msg" class="message" style="display:none"></div>
      </div>
    </div>

    <!-- ===== SETTINGS TAB ===== -->
    <div id="tab-settings" class="tab-panel">
      <div class="card">
        <h3>📋 פרטי הסניף</h3>
        <div id="settings-branch-info"></div>
      </div>
      <div class="card" style="margin-top:14px;">
        <h3>⚙️ הגדרות מערכת</h3>
        <a href="setup.html" class="btn secondary" style="display:inline-block; width:auto; text-decoration:none; padding:10px 20px;">🔧 ערוך הגדרות סניף</a>
      <a href="staffing.html" class="btn secondary" style="display:inline-block; width:auto; text-decoration:none; padding:10px 20px; margin-right:8px;">📊 דרישות שיבוץ</a>
      </div>
    </div>

  </div><!-- /screen-main -->
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="js/firebase.js"></script>
<script src="js/scheduler.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<script src="js/manager.js"></script>
</body>
</html>
