<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ברוכים הבאים — ניהול משמרות</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <div class="section active" style="padding:32px 0; text-align:center;">

    <div style="font-size:64px; margin-bottom:16px;">👋</div>
    <h2 style="margin-bottom:8px;">ברוכים הבאים לניהול משמרות!</h2>
    <p style="color:#888; font-size:14px; margin-bottom:32px;">החשבון שלך נוצר בהצלחה.<br>עכשיו נגדיר יחד את הסניף שלך בכמה שלבים פשוטים.</p>

    <div class="card" style="text-align:right; margin-bottom:24px;">
      <h3 style="margin-bottom:14px;">מה נגדיר?</h3>
      <div style="display:flex; flex-direction:column; gap:10px; font-size:14px;">
        <div>✅ &nbsp;פרטי העסק ושם הסניף</div>
        <div>✅ &nbsp;סוגי משמרות (בוקר, ערב...)</div>
        <div>✅ &nbsp;מחלקות ותפקידים</div>
        <div>✅ &nbsp;הוספת עובדים</div>
        <div>✅ &nbsp;סוגי היעדרויות</div>
        <div>✅ &nbsp;דרישות שיבוץ לכל משמרת</div>
      </div>
    </div>

    <button class="btn success" style="width:100%; font-size:15px; margin-bottom:10px;" onclick="window.location.href='setup.html'">🔧 בוא נתחיל — הגדר את הסניף שלי</button>
    <button class="btn secondary" style="width:100%;" onclick="window.location.href='manager.html'">דלג כרגע ←</button>

  </div>
</div>
</body>
</html>
