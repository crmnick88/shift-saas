<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes, minimum-scale=0.3, maximum-scale=3.0">
  <title>ממשק עובד — ShiftSaaS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">

  <div id="screen-loading" class="section active" style="text-align:center; padding:60px 20px;">
    <div style="font-size:50px; margin-bottom:16px;">⏳</div>
    <p style="color:#888">טוען...</p>
  </div>

  <div id="screen-main" class="section">
    <!-- Header -->
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
      <div>
        <h2 id="emp-welcome" style="margin-bottom:2px;">שלום!</h2>
        <div id="emp-branch-name" style="color:#888; font-size:14px;"></div>
      </div>
      <button class="btn sm danger" onclick="logout()">יציאה</button>
    </div>

    <!-- Tabs -->
    <div class="nav-tabs">
      <div class="nav-tab active" onclick="switchTab('tab-constraints')">⚠️ האילוצים שלי</div>
      <div class="nav-tab" onclick="switchTab('tab-schedule')">📅 הסידור</div>
    </div>

    <!-- Reminder banner (shown when manager sends a push reminder) -->
    <div id="reminder-banner" style="display:none; background:#fff3cd; border:2px solid #ffc107;
         border-radius:10px; padding:12px 16px; margin-bottom:14px; text-align:center;">
      🔔 <strong>תזכורת מהמנהל:</strong> אנא הזן את האילוצים שלך לשבוע הבא
      <button onclick="document.getElementById('reminder-banner').style.display='none'"
        style="margin-right:12px; background:none; border:none; cursor:pointer; font-size:1.1em; vertical-align:middle;">✕</button>
    </div>

    <!-- Constraints Tab -->
    <div id="tab-constraints" class="tab-panel active">
      <div style="display:flex; align-items:center; justify-content:center; gap:6px; margin-bottom:16px;">
        <button class="btn sm secondary" onclick="changeWeek(-1)">← קודם</button>
        <span id="constraint-week-label" style="font-weight:bold; padding:6px 10px; background:#f0f3ff; border-radius:8px; font-size:13px; white-space:nowrap;">—</span>
        <button class="btn sm secondary" onclick="changeWeek(1)">הבא →</button>
      </div>

      <div id="constraint-days-container"></div>

      <button class="btn success" onclick="saveConstraints()">💾 שמור אילוצים</button>
      <div id="constraints-msg" class="message" style="display:none"></div>
    </div>

    <!-- Schedule Tab -->
    <div id="tab-schedule" class="tab-panel">
      <div style="display:flex; align-items:center; justify-content:center; gap:6px; margin-bottom:16px;">
        <button class="btn sm secondary" onclick="changeWeekSchedule(-1)">← קודם</button>
        <span id="schedule-week-label" style="font-weight:bold; padding:6px 10px; background:#f0f3ff; border-radius:8px; font-size:13px; white-space:nowrap;">—</span>
        <button class="btn sm secondary" onclick="changeWeekSchedule(1)">הבא →</button>
      </div>
      <div id="my-schedule-container">
        <p style="color:#aaa; text-align:center; padding:30px;">הסידור טרם פורסם לשבוע זה</p>
      </div>
    </div>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-messaging-compat.js"></script>
<script src="js/firebase.js"></script>
<script src="js/employee.js"></script>
</body>
</html>
